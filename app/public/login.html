<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Client site watchdog</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐕</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F2F4F7;--surface:#fff;--ink:#142033;--muted:#58637A;--line:#DDE2EA;--line-strong:#B9C1CF;--accent:#3B4BD8;--accent-ink:#fff;--crit:#C42B3B;--crit-bg:#FBE4E7;--warn:#B76100;--warn-bg:#FCEFD9}
  @media (prefers-color-scheme: dark){:root{--bg:#0F1623;--surface:#172033;--ink:#E8EDF6;--muted:#9AA6BD;--line:#26324A;--line-strong:#3A4868;--accent:#7C8BFF;--accent-ink:#0F1623;--crit:#FF7686;--crit-bg:#3C1A22;--warn:#F2A33C;--warn-bg:#3A2A12}}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font:15px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
  main{width:min(420px,100%)}
  h1{margin:0 0 6px;font-size:clamp(28px,6vw,38px);line-height:1.1;font-weight:650;letter-spacing:-.025em}
  .sub{margin:0 0 22px;color:var(--muted)}
  form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
  label{display:flex;flex-direction:column;gap:4px;font-weight:550;font-size:14px}
  input{font:inherit;color:inherit;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);width:100%}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .pw{position:relative;display:flex}
  .pw input{padding-right:46px}
  .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}
  .eye:hover{color:var(--ink)}
  .eye svg{width:20px;height:20px}
  .eye .off{display:none}
  .eye[aria-pressed=true] .on{display:none} .eye[aria-pressed=true] .off{display:block}
  button.go{font:inherit;font-weight:600;padding:10px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
  button.go:disabled{opacity:.6;cursor:progress}
  .err{background:var(--crit-bg);border:1px solid var(--crit);border-radius:8px;padding:8px 12px;font-size:14px}
  .setup{background:var(--warn-bg);border:1px solid var(--warn);border-radius:8px;padding:12px;margin-bottom:14px;font-size:14px}
  .setup a{display:inline-block;margin-top:8px;font-weight:600;color:var(--accent)}
  .hint{margin:14px 2px 0;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <h1>Client site watchdog</h1>
  <p class="sub">Sign in with your Uptime Kuma username and password.</p>

  <div class="setup" id="setup" hidden>
    <b>Uptime Kuma has no account yet.</b> Create your account there first, then come back to this page and sign in with it.
    <br><a id="kumaLink" href="http://localhost:3000">Open Uptime Kuma to create your account</a>
  </div>

  <form id="f">
    <div class="err" id="err" role="alert" hidden></div>
    <label>Username<input id="u" type="text" autocomplete="username" autofocus required></label>
    <label>Password
      <span class="pw">
        <input id="p" type="password" autocomplete="current-password" required>
        <button type="button" class="eye" id="eye" aria-label="Show password" aria-pressed="false">
          <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12A3 3 0 1 1 9.88 9.88"/><path d="M1 1l22 22"/></svg>
        </button>
      </span>
    </label>
    <button class="go" id="go" type="submit">Sign in</button>
  </form>
  <p class="hint">Same login as Uptime Kuma, so there is only one account to remember.</p>
</main>
<script>
const $ = (id) => document.getElementById(id);
$('eye').onclick = () => {
  const show = $('p').type === 'password';
  $('p').type = show ? 'text' : 'password';
  $('eye').setAttribute('aria-pressed', show);
  $('eye').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
};
fetch('/api/login-info').then(r => r.json()).then(i => {
  $('kumaLink').href = i.kumaUrl;
  $('setup').hidden = !i.needSetup;
}).catch(() => {});
$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('go').disabled = true; $('err').hidden = true;
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ user: $('u').value, pass: $('p').value }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) return (location.href = '/');
    $('err').textContent = j.error || 'Could not sign in.'; $('err').hidden = false;
  } catch { $('err').textContent = 'Could not reach the watchdog. Check that it is running.'; $('err').hidden = false; }
  $('go').disabled = false;
});
</script>
</body>
</html>
